    const grid = document.getElementById('shop-grid');
    const filterCategory = document.getElementById('filter-category');
    const filterPrice = document.getElementById('filter-price');
    const sortType = document.getElementById('sort-type');
    const searchText = document.getElementById('search-text');
    const hitCount = document.getElementById('hit-count');
    const pagination = document.getElementById('pagination');

    // カテゴリー一覧を動的に生成
    function populateCategories() {
        const categories = new Set();
        shops.forEach(shop => {
            if(shop.category && shop.category !== "-" && shop.category !== "None") {
                // カンマなどで区切られている場合は分割する処理を追加しても良い
                categories.add(shop.category);
            }
        });
        
        // セットを配列にしてソート
        const sortedCategories = Array.from(categories).sort();
        
        sortedCategories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            filterCategory.appendChild(option);
        });
    }

    function getCoordTextForCard(shop){
        const has=Number.isFinite(Number(shop.lat))&&Number.isFinite(Number(shop.lon));
        return has?`<div class="coord-note">📍 座標登録済み（${htmlEscape(shop.coord_accuracy||'精度未記載')}）</div>`:'<div class="coord-note">📍 座標未取得</div>';
    }

    function renderShops() {
        // 1. 絞り込み（フィルターと検索）
        const keyword = searchText.value.toLowerCase();
        
        filteredShops = shops.filter(shop => {
            // キーワード検索
            const matchKeyword = keyword === '' || 
                (shop.name && shop.name.toLowerCase().includes(keyword)) || 
                (shop.menu && shop.menu.toLowerCase().includes(keyword)) ||
                (shop.category && shop.category.toLowerCase().includes(keyword));
            
            // カテゴリ
            const matchCategory = filterCategory.value === 'all' || 
                (shop.category && shop.category.includes(filterCategory.value));
            
            // 価格
            let matchPrice = true;
            const price = parseFloat(shop.price);
            if (filterPrice.value === 'under2000') {
                matchPrice = !isNaN(price) && price < 2000;
            } else if (filterPrice.value === '2000to5000') {
                matchPrice = !isNaN(price) && price >= 2000 && price < 5000;
            } else if (filterPrice.value === 'over5000') {
                matchPrice = !isNaN(price) && price >= 5000;
            }
            
            return matchKeyword && matchCategory && matchPrice;

        const sortVal = sortType.value;
        if (sortVal === 'price-asc') {
            filteredShops.sort((a, b) => {
                let pa = isNaN(parseFloat(a.price)) ? Infinity : parseFloat(a.price);
                let pb = isNaN(parseFloat(b.price)) ? Infinity : parseFloat(b.price);
                return pa - pb;
            });
        } else if (sortVal === 'price-desc') {
            filteredShops.sort((a, b) => {
                let pa = isNaN(parseFloat(a.price)) ? 0 : parseFloat(a.price);
                let pb = isNaN(parseFloat(b.price)) ? 0 : parseFloat(b.price);
                return pb - pa;
            });
        } else if (sortVal === 'walk-asc') {
            filteredShops.sort((a, b) => {
                let wa = isNaN(parseFloat(a.walk)) ? Infinity : parseFloat(a.walk);
                let wb = isNaN(parseFloat(b.walk)) ? Infinity : parseFloat(b.walk);
                return wa - wb;
            });
        } else {
            filteredShops.sort((a, b) => a.id - b.id);
        }

        // 全件数更新
        hitCount.textContent = `全 ${filteredShops.length} 件 (ページ ${currentPage} / ${Math.ceil(filteredShops.length / itemsPerPage) || 1})`;

        // ページネーションの生成
        renderPagination();

        // 3. 表示用のスライスを取得してHTML生成
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const shopsToDisplay = filteredShops.slice(startIndex, endIndex);

        grid.innerHTML = '';
        if (shopsToDisplay.length === 0) {
            grid.innerHTML = '<div class="no-results">条件に一致するお店が見つかりませんでした。</div>';
            return;
        }

        shopsToDisplay.forEach(shop => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // snsリンクの処理
            let snsLinkHtml = `<a href="${shop.sns}" target="_blank" class="sns">HP/SNS</a>`;
            if (!shop.sns || shop.sns === '#' || shop.sns === 'None') {
                snsLinkHtml = `<a href="#" class="sns disabled" onclick="return false;">HP未登録</a>`;
            }
            
            // tblgリンクの処理
            let hpLinkHtml = `<a href="${shop.hp}" target="_blank" class="hp">食べログ</a>`;
            if (!shop.hp || shop.hp === '#' || shop.hp === 'None') {
                hpLinkHtml = `<a href="#" class="hp disabled" onclick="return false;">リンクなし</a>`;
            }
            
            let priceText = isNaN(parseFloat(shop.price)) ? "-" : `約${parseFloat(shop.price).toLocaleString()}円〜`;
            let walkText = isNaN(parseFloat(shop.walk)) ? "-" : `${shop.walk}分`;
            
            let cat = shop.category && shop.category !== 'None' ? shop.category : 'ジャンル不明';

            card.innerHTML = `
                <div class="photo">${shop.photo}</div>
                <div class="info">
                    <span class="category">${cat}</span>
                    <h2 class="name">${shop.name}</h2>
                    
                    <div class="detail-row">
                        <span class="detail-label">📍 アクセス</span>
                        <span>${shop.station} (${walkText})</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">💰 予算(目安)</span>
                        <span class="price">${priceText}</span>
                    </div>
                    <div class="detail-row" style="flex-direction: column;">
                        <span class="detail-label">価格詳細</span>
                        <span class="price" style="text-align: left; font-weight:normal; margin-top:3px;">${shop.price_str}</span>
                    </div>
                    
                    <div class="address-row">
                        <strong>🏠 住所</strong><br>
                        ${shop.address ? htmlEscape(shop.address) : '住所未登録'}
                        ${getCoordTextForCard(shop)}
                    </div>
                    <div class="menu">
                        <strong>🍴 メニュー・特徴</strong><br>
                        ${shop.menu}
                    </div>
                    
                    <div class="links">
                        ${hpLinkHtml}
                        ${snsLinkHtml}
                        <button class="map-btn" data-shop-id="${shop.id}" type="button">📍 地図で見る</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }
    
    function renderPagination() {
        pagination.innerHTML = '';
        const totalPages = Math.ceil(filteredShops.length / itemsPerPage);
        
        if (totalPages <= 1) return;

        // 前へボタン
        const prevBtn = document.createElement('button');
        prevBtn.textContent = '◀';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            currentPage--;
            renderShops();
            window.scrollTo(0, 0);
        };
        pagination.appendChild(prevBtn);

        // ページ番号 (最大5個表示)
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
        }

        for (let i = startPage; i <= endPage; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            if (i === currentPage) btn.className = 'active';
            btn.onclick = () => {
                currentPage = i;
                renderShops();
                window.scrollTo(0, 0);
            };
            pagination.appendChild(btn);
        }

        // 次へボタン
        const nextBtn = document.createElement('button');
        nextBtn.textContent = '▶';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
            currentPage++;
            renderShops();
            window.scrollTo(0, 0);
        };
        pagination.appendChild(nextBtn);
    }


    // ===== 現在地・サイト内地図機能 =====
    let map = null;
    let userMarker = null;
    let shopMarker = null;
    let currentPosition = null;
    let currentShop = null;
    let mapResizeObserver = null;

    const getLocationBtn = document.getElementById('get-location-btn');
    const clearMapBtn = document.getElementById('clear-map-btn');
    const showAllBtn = document.getElementById('show-all-btn');
    const locationStatus = document.getElementById('location-status');
    const mapWrap = document.getElementById('map-wrap');
    const mapSummary = document.getElementById('map-summary');

    function invalidateMapSoon() {
        if (!map) return;
        [50, 150, 350, 700].forEach(ms => {
            setTimeout(() => {
                if (map) map.invalidateSize({ pan: false, animate: false });
            }, ms);
        });
    }

    function ensureMap() {
        if (map) {
            invalidateMapSoon();
            return;
        }
        if (typeof L === 'undefined') {
            locationStatus.textContent = '地図ライブラリの読み込みに失敗しました。ページを再読み込みしてください。';
            return;
        }

        const mapEl = document.getElementById('map');
        map = L.map(mapEl, {
            zoomControl: true,
            attributionControl: true,
            fadeAnimation: false,
            zoomAnimation: false,
            markerZoomAnimation: false
        }).setView([34.846, 135.617], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 表示/サイズ変更後にLeafletへ実サイズを再通知
        if (window.ResizeObserver) {
            mapResizeObserver = new ResizeObserver(() => invalidateMapSoon());
            mapResizeObserver.observe(mapEl);
        }
        window.addEventListener('resize', invalidateMapSoon);

        invalidateMapSoon();
    }

    function formatDistance(meters) {
        if (!Number.isFinite(meters)) return '-';
        if (meters < 1000) return `${Math.round(meters)} m`;
        return `${(meters / 1000).toFixed(2)} km`;
    }

    function distanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const dp = (lat2 - lat1) * Math.PI / 180;
        const dl = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function htmlEscape(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        }[ch]));
    }

    function googleMapsUrl(shop, lat, lon) {
        const destination = encodeURIComponent(`${shop.name} 高槻市 大阪府 日本`);
        const origin = Number.isFinite(lat) && Number.isFinite(lon)
            ? `&origin=${lat},${lon}` : '';
        return `https://www.google.com/maps/dir/?api=1&destination=${destination}${origin}`;
    }

    function getShopPosition(shop) {
        return Number.isFinite(Number(shop.lat)) && Number.isFinite(Number(shop.lon))
            ? {lat:Number(shop.lat),lon:Number(shop.lon)} : null;
    }

    function sameCoordinateShops(shop) {
        const p=getShopPosition(shop);
        if(!p) return [];
        return shops.filter(s=>{
            const q=getShopPosition(s);
            return q && Math.abs(q.lat-p.lat)<1e-9 && Math.abs(q.lon-p.lon)<1e-9;
        });
    }

    function showAllShopMarkers() {
        if(!map) return;
        if(window.shopMarkersLayer) map.removeLayer(window.shopMarkersLayer);
        window.shopMarkersLayer=L.layerGroup().addTo(map);
        const grouped=new Map();
        shops.forEach(s=>{
            const p=getShopPosition(s); if(!p)return;
            const k=`${p.lat},${p.lon}`;
            if(!grouped.has(k))grouped.set(k,[]);
            grouped.get(k).push(s);
        });
        grouped.forEach((group,key)=>{
            const [lat,lon]=key.split(',').map(Number);
            const marker=L.marker([lat,lon],{title:group.length===1?group[0].name:`${group.length}店舗`});
            let body=group.map(s=>`<div style="margin-bottom:8px;"><strong>${htmlEscape(s.name)}</strong><br>${s.address?`🏠 ${htmlEscape(s.address)}<br>`:''}<button type="button" class="popup-shop-button" data-shop-id="${s.id}" style="margin-top:4px;border:0;background:#ff9d00;color:#fff;padding:5px 8px;border-radius:4px;cursor:pointer;">この店を見る</button></div>`).join('');
            if(group.length>1) body=`<strong>📍 ${group.length}店舗</strong><hr style="border:none;border-top:1px solid #ddd;">${body}`;
            marker.bindPopup(body).addTo(window.shopMarkersLayer);
        });
    }

    function showUserMarker() {
        if(!map||!currentPosition)return;
        const {latitude,longitude}=currentPosition;
        if(userMarker) map.removeLayer(userMarker);
        userMarker=L.circleMarker([latitude,longitude],{
            radius:9,color:'#1976d2',fillColor:'#2196f3',fillOpacity:.9,weight:3
        }).addTo(map).bindPopup('📍 あなたの現在地');
    }

    function showShopOnMap(shop) {
        currentShop=shop;
        mapWrap.style.display='block';
        ensureMap();
        invalidateMapSoon();
        showAllShopMarkers();

        const p=getShopPosition(shop);
        if(!p){
            locationStatus.textContent=`「${shop.name}」には緯度・経度が登録されていません。`;
            mapSummary.innerHTML=`<strong>🍽️ ${htmlEscape(shop.name)}</strong><br>${shop.address?`🏠 ${htmlEscape(shop.address)}<br>`:''}<span style="color:#b45309;">この店舗には座標データがありません。</span><br><a href="${googleMapsUrl(shop,currentPosition?.latitude,currentPosition?.longitude)}" target="_blank" rel="noopener noreferrer">Google Mapsで「${htmlEscape(shop.name)}」を開く →</a>`;
            if(currentPosition) map.setView([currentPosition.latitude,currentPosition.longitude],15);
            else map.setView([34.850,135.620],15);
            return;
        }

        if(shopMarker) map.removeLayer(shopMarker);
        const grouped=sameCoordinateShops(shop);
        shopMarker=L.marker([p.lat,p.lon],{zIndexOffset:1000,title:shop.name}).addTo(map)
            .bindPopup(`<strong>${htmlEscape(shop.name)}</strong><br>${shop.address?`🏠 ${htmlEscape(shop.address)}<br>`:''}${grouped.length>1?`<span style="color:#666;">この座標には${grouped.length}店舗のデータがあります。</span>`:''}`)
            .openPopup();

        showUserMarker();

        let distanceText='現在地を取得すると距離を表示できます。';
        if(currentPosition){
            const meters=distanceMeters(currentPosition.latitude,currentPosition.longitude,p.lat,p.lon);
            distanceText=`現在地からの直線距離：約 <strong>${formatDistance(meters)}</strong>`;
            map.fitBounds(L.latLngBounds([currentPosition.latitude,currentPosition.longitude],[p.lat,p.lon]),{padding:[40,40],maxZoom:17});
        } else {
            map.setView([p.lat,p.lon],17);
        }

        mapSummary.innerHTML=`<strong>🍽️ ${htmlEscape(shop.name)}</strong><br>${shop.address?`🏠 ${htmlEscape(shop.address)}<br>`:''}${distanceText}<br><small>座標精度：${htmlEscape(shop.coord_accuracy||'未記載')}</small><br><a href="${googleMapsUrl(shop,currentPosition?.latitude,currentPosition?.longitude)}" target="_blank" rel="noopener noreferrer">Google Mapsでルートを見る →</a>`;
        locationStatus.textContent=`「${shop.name}」を登録済みの座標で地図に表示しました。`;
        invalidateMapSoon();
        mapWrap.scrollIntoView({behavior:'smooth',block:'start'});
    }

    function getCurrentLocation() {
        if (!navigator.geolocation) {
            locationStatus.textContent = 'このブラウザでは現在地取得に対応していません。';
            return;
        }
        locationStatus.textContent = '現在地を取得しています…';

        navigator.geolocation.getCurrentPosition(
            position => {
                currentPosition = position.coords;
                mapWrap.style.display = 'block';
                ensureMap();
                invalidateMapSoon();
                showUserMarker();

                map.setView([currentPosition.latitude, currentPosition.longitude], 16);
                locationStatus.textContent =
                    '現在地を取得しました。店舗カードの「📍 地図で見る」から店舗との位置関係を表示できます。';

                if (currentShop) showShopOnMap(currentShop);
            },
            error => {
                let msg = '現在地を取得できませんでした。';
                if (error.code === error.PERMISSION_DENIED) msg += ' ブラウザの位置情報許可を確認してください。';
                if (error.code === error.TIMEOUT) msg += ' 取得がタイムアウトしました。';
                locationStatus.textContent = msg;
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
    }

    getLocationBtn.addEventListener('click', getCurrentLocation);

    showAllBtn.addEventListener('click', () => {
        mapWrap.style.display='block';
        ensureMap();
        showAllShopMarkers();
        showUserMarker();
        const coords=shops.map(getShopPosition).filter(Boolean);
        if(coords.length){
            const b=L.latLngBounds(coords.map(p=>[p.lat,p.lon]));
            if(currentPosition)b.extend([currentPosition.latitude,currentPosition.longitude]);
            map.fitBounds(b,{padding:[30,30],maxZoom:16});
        }
        locationStatus.textContent=`座標登録済みの ${coords.length} 店舗を地図に表示しました。`;
        mapSummary.innerHTML=`<strong>🗺️ 座標登録済み店舗</strong><br>${coords.length}店舗を表示しています。マーカーをタップすると店舗名・住所を確認できます。`;
        invalidateMapSoon();
        mapWrap.scrollIntoView({behavior:'smooth',block:'start'});
    });

    clearMapBtn.addEventListener('click', () => {
        mapWrap.style.display = 'none';
        currentShop = null;
        locationStatus.textContent =
            '現在地を取得すると、選択した店舗との位置関係・直線距離を地図で確認できます。';
    });

    grid.addEventListener('click', event => {
        const btn = event.target.closest('.map-btn');
        if (!btn) return;
        const shopId = Number(btn.dataset.shopId);
        const shop = shops.find(s => Number(s.id) === shopId);
        if (!shop) return;
        showShopOnMap(shop);
    });

    document.addEventListener('click', event => {
        const btn=event.target.closest('.popup-shop-button');
        if(!btn)return;
        const shop=shops.find(s=>Number(s.id)===Number(btn.dataset.shopId));
        if(shop)showShopOnMap(shop);
    });

    // イベントリスナー
    filterCategory.addEventListener('change', () => { currentPage = 1; renderShops(); });
    filterPrice.addEventListener('change', () => { currentPage = 1; renderShops(); });
    sortType.addEventListener('change', () => { currentPage = 1; renderShops(); });
    searchText.addEventListener('input', () => { currentPage = 1; renderShops(); });

    // 初期化
    populateCategories();
    renderShops();
</script>

</body>
</html>
